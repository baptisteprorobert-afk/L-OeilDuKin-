<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horus athlète">
<meta name="theme-color" content="#0B1220">
<title>Horus — Espace athlète</title>
<style>
  :root{ --bg:#f3f4f7; --surface:#fff; --text:#0B1220; --muted:#8a93a3; --border:#e3e6ec; --accent:#007BFF; --ok:#0f7b5f; --bad:#b3261e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px; }
  body{ padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height:100vh; }
  .wrap{ max-width:640px; margin:0 auto; padding:16px; }
  h1{ font-size:22px; margin:0; } h2{ font-size:18px; margin:0 0 10px; }
  .brand{ text-align:center; padding:28px 0 10px; } .brand b{ font-size:26px; letter-spacing:4px; } .brand span{ display:block; font-size:12px; letter-spacing:3px; color:var(--muted); margin-top:4px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin:10px 0 4px; }
  input,select,textarea{ width:100%; min-height:48px; border:1px solid var(--border); border-radius:12px; padding:0 12px; font-size:16px; background:#fff; color:var(--text); }
  textarea{ padding:10px 12px; }
  .btn{ min-height:48px; border:0; border-radius:12px; padding:0 18px; font-size:16px; font-weight:700; background:var(--text); color:#fff; width:100%; }
  .btn.ghost{ background:#fff; color:var(--text); border:1px solid var(--border); } .btn.danger{ background:#fff; color:var(--bad); border:1px solid #f1c9c6; } .btn.small{ min-height:38px; width:auto; font-size:14px; padding:0 14px; }
  .msg{ color:var(--bad); font-size:14px; min-height:20px; margin:8px 0; } .msg.ok{ color:var(--ok); }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:#c9ced8; margin-right:6px; } .dot.ok{ background:#1fa971; } .dot.wait{ background:#f5a623; } .dot.err{ background:var(--bad); }
  .tabs{ display:flex; gap:6px; padding:10px 16px 0; max-width:640px; margin:0 auto; }
  .tabs button{ flex:1; min-height:44px; padding:0 4px; border:1px solid var(--border); background:#fff; border-radius:12px; font-size:15px; font-weight:700; color:var(--muted); }
  .tabs button.on{ background:var(--text); color:#fff; border-color:var(--text); }
  .day{ font-weight:800; font-size:14px; color:var(--muted); margin:16px 2px 6px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ent{ cursor:pointer; } .ent.ro{ cursor:default; opacity:0.92; }
  .ent b{ font-size:17px; } .ent .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  .pill{ font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:#eef0f4; color:#5b6575; white-space:nowrap; } .pill.me{ background:#e8f2ff; color:#0062CC; } .pill.wait{ background:#fff4e0; color:#8a5200; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; } .chip{ min-height:42px; padding:0 14px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:15px; font-weight:600; } .chip.on{ background:var(--text); color:#fff; border-color:var(--text); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .overlay{ position:fixed; inset:0; background:rgba(11,18,32,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; } .overlay[hidden]{ display:none; }
  .sheet{ background:var(--surface); width:100%; max-width:640px; max-height:94vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; } .x{ border:0; background:#f1f3f6; border-radius:50%; width:40px; height:40px; font-size:20px; }
  .seg{ display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; } .seg button{ border:0; background:#fff; color:var(--muted); min-height:36px; min-width:38px; font-weight:700; font-size:14px; } .seg button.on{ background:var(--text); color:#fff; }
  .empty{ color:var(--muted); text-align:center; padding:24px 8px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; } td,th{ padding:8px 4px; border-bottom:1px solid var(--border); text-align:left; }
  .cbl{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:15px; font-weight:400; color:var(--text); margin:0; } .cbl input{ width:24px; min-height:24px; height:24px; flex-shrink:0; margin-top:1px; }
  .fab{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--accent); color:#fff; border:0; border-radius:999px; min-height:54px; padding:0 22px; font-size:16px; font-weight:800; box-shadow:0 6px 18px rgba(0,123,255,0.4); z-index:6; }
</style>
</head>
<body>

<!-- ===== Connexion / création du compte ===== -->
<div id="authView" hidden>
  <div class="wrap">
    <div class="brand"><b>HORUS</b><span>ESPACE ATHLÈTE</span></div>
    <div class="card" id="joinCard" hidden>
      <h2>Crée ton accès</h2>
      <p style="color:var(--muted);margin:0 0 6px;font-size:14px;">Ton kiné t'a invité à saisir tes séances. Choisis un mot de passe (12 caractères minimum) : tu seras connecté sur ce téléphone pendant 30 jours.</p>
      <label>Adresse e-mail</label><input id="jEmail" type="email" readonly>
      <label>Mot de passe</label><input id="jPass" type="password" autocomplete="new-password">
      <label>Confirme le mot de passe</label><input id="jPass2" type="password" autocomplete="new-password">
      <div class="msg" id="jMsg"></div>
      <button class="btn" id="jBtn">Créer mon accès</button>
    </div>
    <div class="card" id="loginCard" hidden>
      <h2>Connexion</h2>
      <label>Adresse du serveur</label><input id="lUrl" type="url" placeholder="https://…" autocapitalize="off">
      <label>Adresse e-mail</label><input id="lEmail" type="email" autocapitalize="off">
      <label>Mot de passe</label><input id="lPass" type="password" autocomplete="current-password">
      <div class="msg" id="lMsg"></div>
      <button class="btn" id="lBtn">Se connecter</button>
    </div>
  </div>
</div>

<!-- ===== Application ===== -->
<div id="appView" hidden>
  <div class="top"><div><b id="who">Athlète</b><div style="font-size:12px;color:var(--muted);"><span class="dot" id="syncDot"></span><span id="syncTxt">Synchronisation…</span></div></div><button class="btn ghost small" id="logoutBtn">Quitter</button></div>
  <div class="tabs" id="tabs"><button data-tab="programme" class="on">Programme</button><button data-tab="seances">Séances</button><button data-tab="tests">Tests</button><button data-tab="rdv">RDV</button></div>
  <div class="wrap" id="tabBody"></div>
  <button class="fab" id="fab">+ Ajouter</button>
</div>

<!-- ===== Saisie d'une séance ===== -->
<div class="overlay" id="seanceOv" hidden>
  <div class="sheet">
    <div class="head"><h2 id="sTitle">Nouvelle séance</h2><button class="x" id="sClose" aria-label="Fermer">×</button></div>
    <label>Date</label><input type="date" id="sDate">
    <label>Type</label>
    <div class="chips" id="sKind"><button class="chip on" data-k="exercise">Exercice</button><button class="chip" data-k="functional">Fonctionnel / course</button><button class="chip" data-k="neuro">Neurodynamique</button><button class="chip" data-k="stretching">Étirement</button><button class="chip" data-k="isometric">Isométrie</button></div>
    <div id="sFields"></div>
    <label>Effort ressenti (RPE de 1 à 10, facultatif)</label><input id="sRpe" type="number" inputmode="decimal" min="0" max="10" step="0.5" placeholder="ex. 7">
    <div class="msg" id="sMsg"></div>
    <button class="btn" id="sSave">Enregistrer</button>
    <button class="btn danger" id="sDel" style="margin-top:8px;" hidden>Supprimer cette séance</button>
  </div>
</div>

<!-- ===== Saisie d'une mesure de test ===== -->
<div class="overlay" id="testOv" hidden>
  <div class="sheet">
    <div class="head"><h2 id="tTitle">Nouvelle mesure</h2><button class="x" id="tClose" aria-label="Fermer">×</button></div>
    <label>Test</label><select id="tTest"></select>
    <label>Date</label><input type="date" id="tDate">
    <div id="tFields"></div>
    <div class="msg" id="tMsg"></div>
    <button class="btn" id="tSave">Enregistrer</button>
    <button class="btn danger" id="tDel" style="margin-top:8px;" hidden>Supprimer cette mesure</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ===== définitions copiées de l'app du praticien (build_athlete.py) ===== */
var SPEC_TESTS = {
  "Cheville": [
    { id:"cheville_wblt", cat:"Mobilité", name:"WBLT (Weight-Bearing Lunge Test)", hint:"Fente en appui : distance au mur.",
      fields:[ { key:"cm", label:"Distance au mur", type:"number", unit:"cm", step:0.5, primary:true } ] },
    { id:"cheville_footlift", cat:"Équilibre / fonctionnel", name:"Foot lift test (FLT)", hint:"Appui unipodal, yeux fermés, bras croisés ou sur les hanches, 30 s. Note les erreurs et d'où elles viennent (cheville, pied ou hanche). Vidéo conseillée.",
      fields:[ { key:"err", label:"Nombre d'erreurs", type:"number", unit:"erreurs", step:1, primary:true }, { key:"cluster", label:"Cluster (origine des erreurs)", type:"choice", options:["Cheville", "Pied", "Hanche"] } ] },
    { id:"cheville_iso", cat:"Force", name:"Dynamométrie isométrique (inverseurs, éverseurs, releveurs)", hint:"Force maximale isométrique de chaque groupe, cheville en position neutre, 3 essais. Choisis l'unité (N ou kg) à chaque saisie.",
      fields:[ { key:"u", label:"Unité de force", type:"choice", options:["N", "kg"] }, { key:"inv", label:"Inverseurs", type:"number", step:0.1, primary:true }, { key:"ev", label:"Éverseurs", type:"number", step:0.1 }, { key:"rel", label:"Releveurs", type:"number", step:0.1 } ] },
    { id:"cheville_calf", cat:"Force", name:"Calf raise", hint:"Montées sur pointe de pied en appui unipodal, rythme imposé (métronome 60 BPM), amplitude complète, sans compensation, jusqu'à l'échec.",
      fields:[ { key:"reps", label:"Nombre de répétitions", type:"number", unit:"rép.", step:1, primary:true }, { key:"h", label:"Hauteur de montée", type:"number", unit:"cm", step:0.5 } ] },
    { id:"cheville_ybt", cat:"Équilibre / fonctionnel", name:"YBT (Y Balance Test)", hint:"Longueur du membre : de l'épine iliaque antéro-supérieure à la malléole médiale. Portée en % = portée ÷ longueur × 100. Seuils : antérieure ≥ 60 %, postéro-médiale ≥ 100 %, postéro-latérale ≥ 100 %. Score composite = somme des 3 portées ÷ (3 × longueur) × 100.",
      fields:[ { key:"len", label:"Longueur du membre", type:"number", unit:"cm", step:0.5, carry:true }, { key:"ant", label:"Antérieure", type:"number", unit:"cm", step:0.5 },
        { key:"pm", label:"Postéro-médiale", type:"number", unit:"cm", step:0.5 }, { key:"pl", label:"Postéro-latérale", type:"number", unit:"cm", step:0.5 },
        { key:"ant_pct", label:"Antérieure (%)", type:"computed", unit:"%", formula:"ybt_dir", dir:"ant", cut:60, secondary:true },
        { key:"pm_pct", label:"Postéro-médiale (%)", type:"computed", unit:"%", formula:"ybt_dir", dir:"pm", cut:100, secondary:true },
        { key:"pl_pct", label:"Postéro-latérale (%)", type:"computed", unit:"%", formula:"ybt_dir", dir:"pl", cut:100, secondary:true },
        { key:"comp", label:"Score composite", type:"computed", unit:"%", formula:"ybt", primary:true } ] },
    { id:"cheville_sidehop", cat:"Équilibre / fonctionnel", name:"Side hop test", hint:"Rivière de 30 cm : 10 sauts latéraux d'affilée le plus vite possible (une faute n'est pas comptée). Départ par un saut latéral externe. Vidéo conseillée.",
      fields:[ { key:"t", label:"Temps des 10 sauts", type:"number", unit:"s", step:0.01, primary:true } ] },
    { id:"cheville_tch", cat:"Équilibre / fonctionnel", name:"Triple crossover hop test", hint:"Trois sauts consécutifs sur un pied en zigzag de part et d'autre d'une ligne de 15 cm de large, le plus loin possible. Réception stabilisée. Saisis les 3 essais : la meilleure distance est calculée.",
      fields:[ { key:"d1", label:"Essai 1", type:"number", unit:"cm", step:1 }, { key:"d2", label:"Essai 2", type:"number", unit:"cm", step:1 }, { key:"d3", label:"Essai 3", type:"number", unit:"cm", step:1 },
        { key:"best", label:"Meilleure distance", type:"computed", unit:"cm", formula:"max3", primary:true } ] },
    { id:"cheville_jps", cat:"Proprioception", name:"Test de repositionnement articulaire", hint:"Yeux fermés : la cheville est amenée à un angle cible puis ramenée au neutre ; le patient reproduit activement cet angle. Note l'angle cible et l'erreur absolue en degrés.",
      fields:[ { key:"target", label:"Angle cible", type:"number", unit:"°", step:1, carry:true }, { key:"dors", label:"Erreur en flexion dorsale", type:"number", unit:"°", step:0.5 }, { key:"plant", label:"Erreur en flexion plantaire", type:"number", unit:"°", step:0.5, primary:true } ] },
    { id:"cheville_stroop", cat:"Équilibre / fonctionnel", name:"Test de double tâche (Stroop)", hint:"Le foot lift test répété en réalisant en même temps un test de Stroop (dénomination de couleurs incongruentes). Vidéo si possible, sinon note la difficulté et les erreurs.",
      fields:[ { key:"err", label:"Erreurs d'équilibre", type:"number", unit:"erreurs", step:1, primary:true }, { key:"stroop", label:"Score au Stroop", type:"number", step:1 } ] },
    { id:"cheville_faam", cat:"Questionnaires", name:"FAAM", single:true, hint:"Foot and Ankle Ability Measure : sous-échelle activités de la vie quotidienne et sous-échelle sport (scores bruts).",
      fields:[ { key:"adl", label:"Score vie quotidienne", type:"number", step:1, primary:true }, { key:"sport", label:"Score sport", type:"number", step:1 } ] },
    { id:"cheville_fonction", cat:"Questionnaires", name:"Fonction perçue de la cheville", hint:"À combien de % trouves-tu la fonction de ta cheville aujourd'hui ?",
      fields:[ { key:"score", label:"Fonction perçue", type:"number", unit:"/100", step:1, primary:true } ] },
    { id:"cheville_cait", cat:"Questionnaires", name:"CAIT", hint:"Cumberland Ankle Instability Tool : 9 items sur l'instabilité chronique de cheville, score sur 30.",
      fields:[ { key:"score", label:"Score CAIT", type:"number", unit:"/30", step:1, primary:true } ] },
    { id:"cheville_ptgt", cat:"Mobilité", name:"Posterior talar glide test", hint:"Glissement postérieur du talus (mobilité tibio-talaire) : note l'amplitude en degrés.",
      fields:[ { key:"deg", label:"Amplitude", type:"number", unit:"°", step:0.5, primary:true }, { key:"res", label:"Mobilité", type:"choice", options:["Normale", "Diminuée", "Augmentée"], tones:["ok", "warn", "warn"] } ] },
    { id:"cheville_tiroir_sup", cat:"Stabilité ligamentaire", name:"Tiroir antérieur - faisceau supérieur", hint:"Comparer au côté opposé.",
      fields:[ { key:"res", label:"Tiroir antérieur", type:"choice", options:["Négatif", "Douteux", "Positif"], tones:["ok", "warn", "ko"], primary:true }, { key:"end", label:"Fin de course", type:"choice", options:["Ferme", "Molle"], tones:["ok", "warn"] }, { key:"pain", label:"Douleur provoquée", type:"yesno" } ] },
    { id:"cheville_tiroir_inf", cat:"Stabilité ligamentaire", name:"Tiroir antérieur - faisceau inférieur", hint:"Comparer au côté opposé.",
      fields:[ { key:"res", label:"Tiroir antérieur", type:"choice", options:["Négatif", "Douteux", "Positif"], tones:["ok", "warn", "ko"], primary:true }, { key:"end", label:"Fin de course", type:"choice", options:["Ferme", "Molle"], tones:["ok", "warn"] }, { key:"pain", label:"Douleur provoquée", type:"yesno" } ] },
    { id:"cheville_ottawa", cat:"Aide à la décision", name:"Critères d'Ottawa", hint:"Coche les éléments présents à l'examen après un traumatisme de la cheville ou du pied.", rule:"ottawa" },
    { id:"cheville_bernese", cat:"Aide à la décision", name:"Critères de Bernese", hint:"Coche les manœuvres de contrainte indirecte qui provoquent la douleur (traumatisme de basse énergie en supination).", rule:"bernese" }
  ],
  "Hanche": [
    { id:"hanche_copenhague", cat:"Force", name:"Copenhague (adducteurs)", hint:"Planche latérale, jambe du dessus posée sur un banc, jambe du dessous libre. Le bassin reste aligné jusqu'à l'échec.",
      fields:[ { key:"t", label:"Temps tenu", type:"number", unit:"s", step:1, primary:true } ] },
    { id:"hanche_starplank", cat:"Force", name:"Star plank", hint:"Planche en appui sur une main ou sur un avant-bras (fais les deux), les membres du côté opposé écartés en étoile. Position maintenue jusqu'à l'échec.",
      fields:[ { key:"tm", label:"Appui sur la main", type:"number", unit:"s", step:1, primary:true }, { key:"ta", label:"Appui sur l'avant-bras", type:"number", unit:"s", step:1 } ] },
    { id:"hanche_thomas", cat:"Mobilité", name:"Test de Thomas", hint:"Allongé en bord de table, une cuisse tenue contre le thorax. On observe la position de la cuisse libre (psoas, droit fémoral) et de la jambe (angle du genou).",
      fields:[ { key:"hip", label:"Angle de hanche", type:"number", unit:"°", step:0.5, primary:true }, { key:"knee", label:"Angle de genou", type:"number", unit:"°", step:0.5 } ] }
  ],
  "Genou": [
    { id:"genou_nordic", cat:"Force", name:"Nordic hamstring", hint:"À genoux, chevilles fixées, descente du tronc le plus lentement possible en contrôlant avec les ischios, répétitions jusqu'à l'échec musculaire (variante unilatérale possible).",
      fields:[ { key:"reps", label:"Répétitions à l'échec", type:"number", unit:"rép.", step:1, primary:true } ] },
    { id:"genou_bridge", cat:"Force", name:"Single leg bridge", hint:"Allongé, talon d'un pied posé (genou et hanche à 90°) sur un banc ou au sol, l'autre jambe en l'air. Montées de bassin à cadence imposée (60 BPM) jusqu'à l'échec.",
      fields:[ { key:"reps", label:"Répétitions", type:"number", unit:"rép.", step:1, primary:true } ] },
    { id:"genou_ake", cat:"Mobilité", name:"Extension active du genou (AKE)", hint:"Allongé, hanche fléchie à 90°, extension active du genou jusqu'à la limite de la mobilité, sans compensation. Photo conseillée.",
      fields:[ { key:"def", label:"Déficit d'extension", type:"number", unit:"°", step:0.5, primary:true } ] },
    { id:"genou_pslr", cat:"Mobilité", name:"Straight leg raise passif (PSLR)", hint:"Allongé, jambe tendue levée passivement par l'examinateur jusqu'à la tension ressentie, bassin stabilisé.",
      fields:[ { key:"deg", label:"Flexion de hanche", type:"number", unit:"°", step:0.5, primary:true } ] },
    { id:"genou_askling", cat:"Mobilité", name:"H-test d'Askling", hint:"Allongé sur le dos, flexion de hanche genou tendu : la jambe est levée vers le haut de façon rapide et contrôlée. On recherche douleur, appréhension ou limitation.",
      fields:[ { key:"deg", label:"Amplitude", type:"number", unit:"°", step:0.5, primary:true }, { key:"pain", label:"Douleur", type:"number", unit:"/10", step:1 }, { key:"app", label:"Appréhension", type:"number", unit:"/10", step:1 } ] }
  ],
  "Épaule": [
    { id:"epaule_cmp", cat:"Puissance", name:"CMP (push-up avec contre-mouvement)", single:true, hint:"Push-up avec contre-mouvement sur plateforme de force, le plus fort possible. Note tout ce que donne la plateforme.",
      fields:[ { key:"force", label:"Force pic", type:"number", unit:"N", step:1, primary:true }, { key:"h", label:"Hauteur", type:"number", unit:"cm", step:0.1 }, { key:"vol", label:"Temps de vol", type:"number", unit:"ms", step:1 } ] },
    { id:"epaule_ast", cat:"Force", name:"AST (Athletic Shoulder Test)", hint:"Force isométrique en position I, Y et T, allongé sur le ventre, au dynamomètre ou à la plateforme.",
      fields:[ { key:"i", label:"Position I", type:"number", unit:"N", step:1, primary:true }, { key:"y", label:"Position Y", type:"number", unit:"N", step:1 }, { key:"t", label:"Position T", type:"number", unit:"N", step:1 } ] },
    { id:"epaule_ckcuest", cat:"Équilibre / fonctionnel", name:"CKCUEST (Closed Kinetic Chain Upper Extremity Stability Test)", single:true, hint:"En position de pompe, mains écartées de 91,4 cm, pieds à largeur du bassin : toucher alternativement la main opposée pendant 15 s le plus vite possible. 4 essais avec 45 s de récupération.",
      fields:[ { key:"n1", label:"Essai 1", type:"number", unit:"touches", step:1 }, { key:"n2", label:"Essai 2", type:"number", unit:"touches", step:1 }, { key:"n3", label:"Essai 3", type:"number", unit:"touches", step:1 }, { key:"n4", label:"Essai 4", type:"number", unit:"touches", step:1 },
        { key:"moy", label:"Moyenne des essais", type:"computed", unit:"touches", formula:"mean", keys:["n1", "n2", "n3", "n4"], primary:true } ] },
    { id:"epaule_smbt", cat:"Puissance", name:"SMBT (Seated Medicine Ball Throw)", single:true, hint:"Assis contre un mur, lancer à deux mains d'une médecine-ball de 2 kg le plus loin possible (comme une passe de basket). Saisis les essais : la meilleure distance est calculée.",
      fields:[ { key:"d1", label:"Essai 1", type:"number", unit:"cm", step:1 }, { key:"d2", label:"Essai 2", type:"number", unit:"cm", step:1 }, { key:"d3", label:"Essai 3", type:"number", unit:"cm", step:1 },
        { key:"best", label:"Meilleure distance", type:"computed", unit:"cm", formula:"max3", primary:true } ] },
    { id:"epaule_sambt", cat:"Puissance", name:"SAMBT (Single Arm Medicine Ball Throw)", hint:"Assis, lancer d'une médecine-ball de 2 kg à une seule main, le plus loin possible.",

function toNum(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function specComputed(f, d){
  var L = toNum(d.len);
  if(f.formula === "ybt"){
    var a = toNum(d.ant), b = toNum(d.pm), c = toNum(d.pl);
    if(a !== null && b !== null && c !== null && L !== null && L > 0) return Math.round((a + b + c) / (3 * L) * 1000) / 10;
  }
  if((f.formula === "mean" || f.formula === "max") && f.keys){
    var vs = f.keys.map(function(k){ return toNum(d[k]); }).filter(function(x){ return x !== null; });
    if(!vs.length) return null;
    return f.formula === "max" ? Math.max.apply(null, vs) : Math.round(vs.reduce(function(a, b){ return a + b; }, 0) / vs.length * 10) / 10;
  }
  if(f.formula === "max3"){
    var xs = [toNum(d.d1), toNum(d.d2), toNum(d.d3)].filter(function(x){ return x !== null; });
    return xs.length ? Math.max.apply(null, xs) : null;
  }
  if(f.formula === "ybt_dir"){
    var r = toNum(d[f.dir]);
    if(r !== null && L !== null && L > 0) return Math.round(r / L * 1000) / 10;
  }
  return null;
}

/* ---------- serveur ---------- */
async function api(path, method, body, noAuth){
  var h = { "Content-Type":"application/json" }; if(store.token && !noAuth) h.Authorization = "Bearer " + store.token;
  var r = await fetch(store.url + path, { method: method || "GET", headers: h, body: body === undefined ? undefined : JSON.stringify(body), cache:"no-store" });
  var j = null; try{ j = await r.json(); }catch(e){} return { status: r.status, json: j };
}
function setStatus(kind, txt){ $("syncDot").className = "dot " + kind; $("syncTxt").textContent = txt; }
var syncing = false, again = false;
async function sync(){
  if(!store.token) return;
  if(syncing){ again = true; return; }
  syncing = true;
  try{
    setStatus("wait", "Synchronisation…");
    var guard = 0, since = store.rev || 0;
    while(guard++ < 100){
      var r = await api("/api/sync?since=" + since + "&limit=100");
      if(r.status === 401 || r.status === 403){ logout("Ton accès a été coupé ou a expiré : reconnecte-toi."); return; }
      if(r.status !== 200) throw new Error((r.json && r.json.message) || "Erreur du serveur");
      var docs = r.json.docs || [];
      docs.forEach(function(d){
        if(d.c === "patients"){ if(!d.deleted && d.data) store.patient = d.data; }
        else if(d.c === "athEntries"){ if(d.deleted){ delete store.ath[d.id]; } else if(!store.pending[d.id]) store.ath[d.id] = { id:d.id, data:d.data, updatedAt:d.updatedAt }; }
        else if(d.c === "agenda"){ if(d.deleted) delete store.agenda[d.id]; else store.agenda[d.id] = d.data; }
        else if(d.c === "exerciseCatalog"){ if(d.deleted) delete store.catalog[d.id]; else store.catalog[d.id] = d.data; }
      });
      if(docs.length) since = docs[docs.length - 1].rev;
      if(!r.json.more) break;
    }
    store.rev = since;
    var ids = Object.keys(store.pending);
    while(ids.length){
      var batch = ids.splice(0, 40).map(function(i){ return store.pending[i]; });
      var p = await api("/api/sync", "POST", { docs: batch });
      if(p.status === 401){ logout("Ton accès a été coupé ou a expiré : reconnecte-toi."); return; }
      if(p.status === 403){ throw new Error("Cet envoi n'est pas autorisé pour ton accès."); }
      if(p.status !== 200) throw new Error((p.json && p.json.message) || "Erreur du serveur");
      batch.forEach(function(d){ delete store.pending[d.id]; });
    }
    store.lastOk = nowIso(); save(); setStatus("ok", "À jour"); render();
  }catch(e){ save(); setStatus(navigator.onLine ? "err" : "wait", navigator.onLine ? "Erreur : " + (e && e.message || e) : "Hors ligne : tes saisies sont gardées et partiront au retour du réseau"); render(); }
  finally{ syncing = false; if(again){ again = false; setTimeout(sync, 300); } }
}

}
$("tTest").addEventListener("change", function(){ renderTFields(null); });
$("tFields").addEventListener("input", function(){ var t = myTests().find(function(x){ return x.id === $("tTest").value; }), def = t && specDefOf(t); if(def && !def.rule && !def.noteOnly) updateComputed(def); });
$("tFields").addEventListener("click", function(e){
  var sb = e.target.closest("[data-side]"); if(sb){ tSide = tSide === sb.dataset.side ? "" : sb.dataset.side; [].forEach.call($("tSideRow").children, function(x){ x.classList.toggle("on", x.dataset.side === tSide); }); return; }
  var u = e.target.closest(".seg [data-u]"); if(!u) return; var nu = u.dataset.u; if(nu === tUnit) return;
  ["tPD", "tPG"].forEach(function(id){ var i = $(id), v = parseFloat(i.value); if(!isNaN(v)) i.value = String(nu === "ms" ? Math.round(v * 1000) : Math.round(v / 1000 * 100000) / 100000); });
  tUnit = nu; [].forEach.call(u.parentNode.children, function(x){ x.classList.toggle("on", x === u); });
});
$("tSave").addEventListener("click", function(){
  var t = myTests().find(function(x){ return x.id === $("tTest").value; }); if(!t) return;
  var date = $("tDate").value; if(!/^\d{4}-\d\d-\d\d$/.test(date)){ $("tMsg").textContent = "Choisis une date."; return; }
  var en = { id: tEditId ? store.ath[tEditId].data.entry.id : newId(), date: date }, k = testKind(t);
  if(k === "iso"){
    var d = $("tD").value, g = $("tG").value; if(d === "" && g === ""){ $("tMsg").textContent = "Renseigne au moins une valeur (droite ou gauche)."; return; }
    if(d !== "") en.valueD = parseFloat(String(d).replace(",", ".")); if(g !== "") en.valueG = parseFloat(String(g).replace(",", "."));
    var pd = parseFloat(String($("tPD").value).replace(",", ".")), pg = parseFloat(String($("tPG").value).replace(",", "."));
    if(!isNaN(pd)) en.ttpD = Math.round((tUnit === "ms" ? pd / 1000 : pd) * 100000) / 100000; if(!isNaN(pg)) en.ttpG = Math.round((tUnit === "ms" ? pg / 1000 : pg) * 100000) / 100000;
  } else if(k === "jump"){ var v = $("tV").value; if(v === ""){ $("tMsg").textContent = "Renseigne la valeur."; return; } en.value = parseFloat(String(v).replace(",", ".")); }
  else {
    var def = specDefOf(t); en.note = ($("tNote").value || "").trim().slice(0, 1000); en.tags = [];
    if(def.rule){ en.checks = {}; document.querySelectorAll("#tFields [data-chk]").forEach(function(c){ if(c.checked) en.checks[c.getAttribute("data-chk")] = true; }); en.side = tSide; if(!Object.keys(en.checks).length && !confirm("Aucune case cochée : enregistrer un résultat négatif ?")) return; }
    else if(def.noteOnly){ if(!en.note){ $("tMsg").textContent = "Écris tes observations."; return; } }
    else { en.data = {}; specSides(def).forEach(function(sd){ en.data[sd] = {}; }); document.querySelectorAll("#tFields [data-spf]").forEach(function(i){ var p = i.getAttribute("data-spf").split(":"), f = def.fields.find(function(x){ return x.key === p[1]; }); if(i.value === "" || !en.data[p[0]]) return; if(f.type === "number"){ var n = toNum(i.value); if(n !== null) en.data[p[0]][p[1]] = n; } else en.data[p[0]][p[1]] = i.value; });
      if(!specSides(def).some(function(sd){ return Object.keys(en.data[sd]).length; })){ $("tMsg").textContent = "Renseigne au moins une valeur."; return; } }
  }
  var docId = tEditId || (store.patientId + "-" + en.id);
  var data = { id: docId, patientId: store.patientId, by:"athlete", kind:"test", testId: t.id, date: date, entry: en };
  if(k === "iso" && (en.ttpD !== undefined || en.ttpG !== undefined)) data.ttpUnit = tUnit;
  putDoc(docId, data); $("testOv").hidden = true; render(); sync();
});
$("tDel").addEventListener("click", function(){ if(tEditId && confirm("Supprimer cette mesure ?")){ delDoc(tEditId); $("testOv").hidden = true; render(); sync(); } });
$("tClose").addEventListener("click", function(){ $("testOv").hidden = true; });
$("fab").addEventListener("click", function(){ if(tab === "tests") openTest(null); else openSeance(null); });

/* ---------- rendez-vous ---------- */
function renderRdv(){
  var list = Object.keys(store.agenda).map(function(k){ return store.agenda[k]; }).filter(function(a){ return a && a.date >= today() && a.status !== "annule"; }).sort(function(a, b){ return (a.date + a.start).localeCompare(b.date + b.start); });
  $("tabBody").innerHTML = list.length ? list.map(function(a){ return '<div class="card"><div class="row"><div><b>' + esc(fmtDate(a.date)) + '</b><div class="sub" style="font-size:13px;color:var(--muted);">' + esc(a.start) + (a.dur ? " · " + esc(a.dur) + " min" : "") + (a.type ? " · " + esc(a.type) : "") + '</div></div></div></div>'; }).join("") : '<div class="empty">Aucun rendez-vous à venir.</div>';
}

/* ---------- connexion ---------- */
$("jBtn").addEventListener("click", async function(){
  var p = $("jPass").value, p2 = $("jPass2").value; $("jMsg").textContent = "";
  if(p.length < 12){ $("jMsg").textContent = "12 caractères minimum."; return; } if(p !== p2){ $("jMsg").textContent = "Les deux mots de passe sont différents."; return; }
  try{ var r = await api("/api/athlete/join", "POST", { email: store.email, code: store.code, password: p }, true);
    if(r.status !== 200){ $("jMsg").textContent = (r.json && r.json.message) || "Impossible de créer l'accès."; return; }
    store.token = r.json.token; store.patientId = r.json.patient; store.code = ""; save(); history.replaceState(null, "", location.pathname); showApp();
  }catch(e){ $("jMsg").textContent = "Serveur injoignable. Vérifie ta connexion."; }
});
$("lBtn").addEventListener("click", async function(){
  store.url = $("lUrl").value.trim().replace(/\/+$/, ""); store.email = $("lEmail").value.trim().toLowerCase(); $("lMsg").textContent = "";
  try{ var r = await api("/api/login", "POST", { email: store.email, password: $("lPass").value }, true);
    if(r.status !== 200){ $("lMsg").textContent = (r.json && r.json.message) || "Connexion impossible."; return; }
    if(r.json.role !== "athlete"){ $("lMsg").textContent = "Ce compte n'est pas un accès athlète."; return; }
    store.token = r.json.token; var me = await api("/api/me", "GET"); store.patientId = me.json && me.json.patient; save(); showApp();
  }catch(e){ $("lMsg").textContent = "Serveur injoignable. Vérifie ta connexion."; }
});
$("logoutBtn").addEventListener("click", function(){ if(Object.keys(store.pending).length && !confirm("Des saisies n'ont pas encore été envoyées et seront perdues. Quitter quand même ?")) return; if(confirm("Te déconnecter de ce téléphone ?")){ logout(""); } });
window.addEventListener("online", sync); setInterval(function(){ if(!document.hidden) sync(); }, 60000); document.addEventListener("visibilitychange", function(){ if(!document.hidden) sync(); });

/* ---------- démarrage ---------- */
(function init(){
  var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  if(h.get("c") && h.get("s") && h.get("e")){
    store = { url: h.get("s").replace(/\/+$/, ""), email: h.get("e").toLowerCase(), code: h.get("c"), token:"", patientId:"", rev:0, patient:null, ath:{}, pending:{}, agenda:{}, catalog:{}, status:"", lastOk:"" };
    save(); $("jEmail").value = store.email; showAuth("join"); return;
  }
  if(store.token){ showApp(); return; }
  showAuth("login");
})();
})();
</script>
</body>
